name: Release

# Publish every @ayepi/* package to npm with trusted publishing (no stored token).
#
# All packages share one version. To release:
#   pnpm version:set <patch|minor|major|x.y.z>
#   run the checks locally (CI runs them on main), commit, push main, then:
#   git tag v<version> && git push origin v<version>
#
# scripts/publish-ci.mjs refuses mixed versions or a tag that doesn't match, packs each package with
# pnpm (rewriting `workspace:^` to real versions) and publishes it with npm in dependency order,
# skipping any version already on the registry. Each package needs a trusted publisher on npmjs.com:
# repo ClickerMonkey/ayepi, workflow release.yml, environment npm.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack, but don't publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # GitHub-hosted on purpose: npm trusted publishing only accepts OIDC tokens from cloud runners
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: npm with trusted publishing (11.5.1+)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (dual ESM/CJS + d.ts)
        run: pnpm -r build

      - name: Packaging gate (publint)
        run: pnpm -r publint

      - name: Publish to npm
        run: node scripts/publish-ci.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
